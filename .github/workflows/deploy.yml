# Triggering final fresh deployment
name: 🚀 Déploiement Automatique TFExpress

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Installation et Build du Frontend
        run: |
          cd ecommerce-frontend
          npm install --legacy-peer-deps
          CI=false npm run build

      - name: 🚀 Transfert vers Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 147.93.88.155
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ecommerce-frontend/UPLOAD_SUR_HOSTINGER/
          server-dir: public_html/
          protocol: ftp
          port: 21
          timeout: 60000
          dangerous-clean-slate: false
